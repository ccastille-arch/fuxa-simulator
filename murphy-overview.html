<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Process Overview — Murphy Style</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;font-size:14px;overflow:hidden;height:100vh;display:flex;flex-direction:column;}

/* Header */
.header{background:#006600;color:#fff;display:flex;align-items:center;padding:4px 12px;font-size:13px;font-weight:bold;border-bottom:2px solid #004400;flex-shrink:0;height:28px;}
.header .left{flex:1;text-align:left;}.header .center{flex:2;text-align:center;font-size:14px;}.header .right{flex:1;text-align:right;}

/* Status */
.status-banner{background:#000;text-align:center;padding:4px 0;font-size:13px;font-weight:bold;flex-shrink:0;border-bottom:1px solid #333;}
.status-banner .state{color:#00cc00;}.status-banner .action{color:#00cc00;font-size:12px;}
.info-icon{position:absolute;top:38px;right:16px;width:28px;height:28px;border-radius:50%;border:2px solid #0044cc;color:#0044cc;font-size:18px;font-weight:bold;text-align:center;line-height:26px;cursor:pointer;z-index:10;}

/* Gauge grid */
.gauge-area{flex:1;display:flex;flex-direction:column;padding:6px 8px;gap:4px;position:relative;overflow:hidden;}
.gauge-row{display:flex;flex:1;gap:4px;}
.gauge-cell{flex:1;position:relative;min-width:0;}
.gauge-cell object{width:100%;height:100%;display:block;}

/* Content area for non-gauge pages */
.content-area{display:none;flex:1;overflow-y:auto;padding:0;}

/* Data table */
.dtable{width:100%;border-collapse:collapse;}
.dtable td{padding:6px 12px;border-bottom:1px solid #333;font-size:14px;}
.dtable td:first-child{color:#ccc;width:55%;}
.dtable td:nth-child(2){color:#fff;font-weight:bold;text-align:right;font-size:16px;font-family:Consolas,monospace;}
.dtable td:nth-child(3){color:#888;font-size:12px;padding-left:4px;width:60px;}

/* === PID Block Diagram — Murphy Style === */
.pid-page{height:100%;display:flex;align-items:center;justify-content:center;padding:10px 20px;}
.pid-diagram{display:flex;align-items:center;gap:0;width:100%;max-width:1100px;height:100%;}

/* Left: PID rows stacked */
.pid-col-left{display:flex;flex-direction:column;justify-content:space-around;height:100%;flex:0 0 auto;gap:8px;padding:10px 0;}
.pid-row{display:flex;align-items:center;gap:0;}

/* PV/SP/DB values */
.pid-vals{text-align:right;padding-right:6px;font-size:15px;line-height:1.6;font-family:Consolas,monospace;white-space:nowrap;}
.pid-vals .lbl{color:#0cc;}
.pid-vals .lbl-sp{color:#0c0;}
.pid-vals .val{color:#fff;font-weight:bold;}
.pid-vals .unit{color:#0cc;font-size:12px;}

/* Gray 3D box */
.gray-box{background:linear-gradient(180deg,#c8c8c8 0%,#a0a0a0 50%,#888 100%);color:#000;font-weight:bold;text-align:center;padding:14px 18px;font-size:15px;line-height:1.3;cursor:pointer;border:2px solid #aaa;border-radius:2px;min-width:140px;user-select:none;}
.gray-box:hover{background:linear-gradient(180deg,#ddd 0%,#b0b0b0 50%,#999 100%);}
.gray-box:active{background:linear-gradient(180deg,#888 0%,#a0a0a0 50%,#c8c8c8 100%);}

/* CV label after box */
.pid-cv{font-size:14px;padding:0 10px;white-space:nowrap;}
.pid-cv .cv-lbl{color:#888;}
.pid-cv .cv-val{color:#cc0;font-family:Consolas,monospace;font-weight:bold;}

/* Vertical fader */
.pid-fader{width:22px;height:80px;background:#666;border:1px solid #999;display:flex;flex-direction:column;margin:0 4px;}
.pid-fader-seg{flex:1;border-bottom:1px solid #888;}
.pid-fader-seg:last-child{border-bottom:none;}
.pid-fader-thumb{width:100%;height:4px;background:#0cc;margin-top:auto;}

/* Horizontal connector line */
.h-line{height:2px;background:#888;flex:1;min-width:20px;}
.h-line-long{height:2px;background:#888;width:40px;}

/* Vertical bus (merge point) */
.pid-col-bus{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;position:relative;width:4px;}
.v-bus{width:2px;background:#888;flex:1;}

/* Center merge area */
.pid-col-center{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 16px;gap:4px;}
.merge-cv{font-size:14px;white-space:nowrap;}
.merge-cv .cv-lbl{color:#888;}
.merge-cv .cv-val{color:#cc0;font-family:Consolas,monospace;font-weight:bold;}
.not-enabled{color:#888;font-size:13px;font-style:italic;}

/* Right: output + overrides */
.pid-col-right{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-left:10px;}
.pid-out-row{display:flex;align-items:center;gap:10px;}
.out-label{font-size:14px;color:#ccc;text-align:left;line-height:1.4;}
.out-label .out-val{color:#0ff;font-weight:bold;font-family:Consolas,monospace;font-size:18px;}

/* Dump totals table */
.dump-table{padding:12px 20px;}
.dump-table table{width:100%;border-collapse:collapse;}
.dump-table td{padding:5px 10px;border-bottom:1px solid #333;font-size:13px;}
.dump-table td:first-child{color:#ccc;}
.dump-table td:nth-child(2){color:#fff;font-weight:bold;text-align:right;font-family:Consolas,monospace;}
.dump-table td:nth-child(3){color:#888;font-size:11px;padding-left:4px;}
.dump-table .section-gap td{border:none;height:12px;}
.dump-table .btn-cell{text-align:center;padding:12px;}
.dump-table .btn-cell button{background:#0044cc;color:#fff;border:none;padding:10px 30px;border-radius:4px;font-size:14px;font-weight:bold;cursor:pointer;}

/* Nav bar */
.navbar{display:flex;flex-shrink:0;border-top:2px solid #333;height:44px;}
.navbar button{flex:1;border:none;font-size:13px;font-weight:bold;cursor:pointer;font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px;}
.nav-menu{background:#555;color:#fff;}.nav-menu:hover{background:#666;}
.nav-config{background:#006600;color:#fff;}.nav-config:hover{background:#007700;}
.nav-stop{background:#cc0000;color:#fff;}.nav-stop:hover{background:#dd0000;}
.nav-prev,.nav-next{background:#ddd;color:#000;}.nav-prev:hover,.nav-next:hover{background:#eee;}
.nav-ctrl{background:#0044cc;color:#fff;}.nav-ctrl:hover{background:#0055dd;}

/* Sim panel */
.sim-toggle{position:fixed;bottom:52px;right:8px;background:#1a1a2e;border:1px solid #3a3a50;color:#aaa;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;z-index:20;}
.sim-toggle:hover{border-color:#00aa00;color:#00aa00;}
.sim-panel{display:none;position:fixed;bottom:52px;right:8px;background:#111122;border:1px solid #2a2a40;border-radius:8px;padding:14px;width:320px;z-index:20;box-shadow:0 4px 20px rgba(0,0,0,.6);}
.sim-panel.show{display:block;}
.sim-panel h4{font-size:11px;color:#606070;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.sim-panel label{font-size:11px;color:#909090;display:block;margin-bottom:3px;}
.sim-panel input[type=range]{width:100%;accent-color:#00aa00;}
.sim-panel .sv{font-family:Consolas,monospace;font-size:16px;font-weight:bold;color:#e0e0e0;text-align:center;margin:4px 0 8px;}
.sim-panel .btns{display:flex;gap:4px;flex-wrap:wrap;}
.sim-panel .btns button{background:#1e1e35;border:1px solid #3a3a50;color:#c0c0c0;padding:4px 8px;border-radius:3px;font-size:10px;cursor:pointer;}
.sim-panel .btns button:hover{background:#2a2a45;}
.sim-close{position:absolute;top:6px;right:10px;background:none;border:none;color:#666;font-size:16px;cursor:pointer;}

/* Overlays */
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:100;flex-direction:column;}
.overlay.show{display:flex;}
.overlay-bar{background:#111122;border-bottom:1px solid #2a2a40;padding:8px 16px;display:flex;align-items:center;gap:10px;}
.overlay-bar h2{font-size:14px;color:#e0e0e0;flex:1;}
.overlay-bar button{background:#1a1a2e;border:1px solid #3a3a50;color:#c0c0c0;padding:5px 14px;border-radius:4px;font-size:12px;cursor:pointer;}
.overlay-bar button:hover{background:#2a2a45;}
.overlay-bar .green{border-color:#00aa00;color:#00aa00;}
.overlay-bar .orange{border-color:#cc8844;color:#cc8844;}
.code-area{flex:1;overflow:hidden;}
.code-area textarea{width:100%;height:100%;background:#0d0d1a;color:#c8d8c8;border:none;padding:16px;font-family:'Cascadia Code',Consolas,monospace;font-size:13px;line-height:1.5;resize:none;tab-size:2;}
.code-area textarea:focus{outline:none;}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#1a5e3a;color:#fff;padding:8px 20px;border-radius:6px;font-size:13px;z-index:200;display:none;}
.toast.show{display:block;}
</style>
</head>

  <div class="sv" id="simPct">50%</div>
  <div class="btns">
    <button onclick="simMode('sine')">Sine Wave</button>
    <button onclick="simMode('ramp')">Ramp Up</button>

    <button onclick="simMode('normal')">Normal Ops</button>
    <button onclick="simMode('stop')" id="simStopBtn" style="display:none">Stop</button>

// ============================================================
//  PID block diagram renderer
// ============================================================
function renderPIDPage(title, pids, output, overrides){
  var h='<div class="pid-page"><div class="pid-diagram">';

  // LEFT COLUMN — PID blocks stacked
  h+='<div class="pid-col-left">';
  for(var i=0;i<pids.length;i++){
    var p=pids[i];
    h+='<div class="pid-row">';
    // PV/SP/DB values
    h+='<div class="pid-vals">';
    h+='<div><span class="lbl">PV:</span> <span class="val">'+p.pv.toFixed(1)+'</span></div>';
    h+='<div><span class="lbl-sp">SP:</span> <span class="val">'+p.sp+'</span></div>';
    h+='<div><span class="lbl">DB:</span> <span class="val">'+p.db+'</span></div>';
    h+='<div class="unit">'+p.unit+'</div>';
    h+='</div>';
    // Gray box with PID name
    h+='<div class="gray-box" onclick="toast(\''+p.name.replace(/\n/g,' ')+' Setup\')">'+p.name.replace(/\n/g,'<br>')+'</div>';
    // CV output
    h+='<div class="pid-cv"><span class="cv-lbl">CV:</span> <span class="cv-val">'+p.cv+'%</span></div>';
    // Fader
    h+='<div class="pid-fader">';
    for(var f=0;f<8;f++) h+='<div class="pid-fader-seg"></div>';
    h+='</div>';
    // Horizontal line to bus
    h+='<div class="h-line"></div>';
    h+='</div>'; // end pid-row
  }
  h+='</div>'; // end pid-col-left

  // VERTICAL BUS (merge lines)
  h+='<div class="pid-col-bus"><div class="v-bus"></div></div>';

  // CENTER — merged CV and status
  h+='<div class="pid-col-center">';
  h+='<div class="merge-cv"><span class="cv-lbl">CV:</span> <span class="cv-val">'+output.cv+'%</span></div>';
  for(var j=0;j<overrides.length;j++){
    var ov=overrides[j];
    if(ov.items){for(var k=0;k<ov.items.length;k++){
      h+='<div class="not-enabled">'+ov.items[k]+'</div>';
    }}
  }
  h+='</div>';

  // Horizontal line to output
  h+='<div class="h-line-long"></div>';

  // RIGHT COLUMN — output block + overrides button
  h+='<div class="pid-col-right">';
  // Output gray box + commanded value
  h+='<div class="pid-out-row">';
  h+='<div class="gray-box" onclick="toast(\''+output.name.replace(/\n/g,' ')+' Settings\')">'+output.name.replace(/\n/g,'<br>')+'</div>';
  h+='<div class="out-label">'+output.label+'<br><span class="out-val">'+output.val+' '+output.unit+'</span></div>';
  h+='</div>';
  // Overrides box
  if(overrides.length>0){
    h+='<div class="gray-box" style="min-width:160px" onclick="toast(\'Overrides Settings\')">OVERRIDES</div>';
  }
  h+='</div>'; // end pid-col-right

  h+='</div></div>'; // end pid-diagram, pid-page
  return h;
}

// ============================================================
//  State
// ============================================================
var currentPage=0, gaugePVs=[], loadedCount=0, simTimer=null, svgSource='';

// Clock
function updateClock(){var d=new Date();var mo=('0'+(d.getMonth()+1)).slice(-2),dy=('0'+d.getDate()).slice(-2),yr=d.getFullYear();var h=('0'+d.getHours()).slice(-2),m=('0'+d.getMinutes()).slice(-2),s=('0'+d.getSeconds()).slice(-2);document.getElementById('hdrTime').textContent=mo+'/'+dy+'/'+yr+' - '+h+':'+m+':'+s;}
setInterval(updateClock,1000);updateClock();

// Load gauges
for(var i=0;i<8;i++){(function(idx){
  var obj=document.getElementById('g'+idx);
  obj.addEventListener('load',function(){
    gaugePVs[idx]=obj.contentDocument.defaultView.putValue;
    if(!svgSource)svgSource=new XMLSerializer().serializeToString(obj.contentDocument.documentElement);
    loadedCount++;
    if(loadedCount===8)showPage(0);
  });
})(i);}

// ============================================================
//  Page navigation
// ============================================================
function showPage(idx){
  if(simTimer)simMode('stop');
  currentPage=idx;
  var page=PAGES[idx];
  document.getElementById('hdrTitle').textContent=page.title;
  var ga=document.getElementById('gaugeArea');
  var ca=document.getElementById('contentArea');

  if(page.type==='gauges'){
    ga.style.display='flex'; ca.style.display='none';
    configureGauges(page.gauges);
  } else {
    ga.style.display='none'; ca.style.display='block';
    ca.innerHTML=page.render();
  }
}

function configureGauges(gauges){
  for(var i=0;i<8;i++){
    var g=gauges[i]; if(!g||!gaugePVs[i])continue;
    var pv=gaugePVs[i];
    pv('_ps_label',g.label);pv('_ps_unit',g.unit);pv('_pn_precision',g.prec);
    pv('_pn_fullMin',g.fMin);pv('_pn_fullMax',g.fMax);
    pv('_pn_lowShutdown',g.ls);pv('_pn_lowAlarm',g.la);pv('_pn_highAlarm',g.ha);pv('_pn_highShutdown',g.hs);
    pv('_pb_autoScale',g.auto);pv('_pn_manualDisplayMin',g.mMin);pv('_pn_manualDisplayMax',g.mMax);
    pv('_pn_scalePaddingPercent',0);
    if(g.nz){pv('_pc_normalColor','#00aa00');pv('_pc_alarmColor','#00aa00');pv('_pc_shutdownColor','#00aa00');}
    else{pv('_pc_normalColor','#00aa00');pv('_pc_alarmColor','#cccc00');pv('_pc_shutdownColor','#cc0000');}
    pv('_pn_value',g.val);
  }
}

function navPage(dir){
  var next=currentPage+dir;
  if(next<0)next=PAGES.length-1;
  if(next>=PAGES.length)next=0;
  showPage(next);
}

// ============================================================
//  Sim
// ============================================================
function toggleSim(){document.getElementById('simPanel').classList.toggle('show');}

function simSweep(){
  var pct=parseFloat(document.getElementById('simSlider').value)/100;
  document.getElementById('simPct').textContent=Math.round(pct*100)+'%';
  var page=PAGES[currentPage];
  if(page.type!=='gauges')return;
  for(var i=0;i<8;i++){
    if(!gaugePVs[i]||!page.gauges[i])continue;
    var g=page.gauges[i];
    gaugePVs[i]('_pn_value',g.fMin+pct*(g.fMax-g.fMin));
  }
}

function simMode(mode){
  if(simTimer){clearInterval(simTimer);simTimer=null;}
  document.getElementById('simStopBtn').style.display=(mode==='stop')?'none':'inline-block';
  if(mode==='stop')return;
  var page=PAGES[currentPage];
  if(page.type!=='gauges')return;
  if(mode==='sine'){var t=0;simTimer=setInterval(function(){t+=.02;for(var i=0;i<8;i++){if(!gaugePVs[i]||!page.gauges[i])continue;var g=page.gauges[i];var mid=(g.fMin+g.fMax)/2,amp=(g.fMax-g.fMin)/2*.85;gaugePVs[i]('_pn_value',mid+amp*Math.sin(t+i*.4));}document.getElementById('simSlider').value=50+42.5*Math.sin(t);document.getElementById('simPct').textContent=Math.round(50+42.5*Math.sin(t))+'%';},30);}
  if(mode==='ramp'){var t=0;simTimer=setInterval(function(){t+=.002;if(t>1.1)t=0;for(var i=0;i<8;i++){if(!gaugePVs[i]||!page.gauges[i])continue;var g=page.gauges[i];gaugePVs[i]('_pn_value',g.fMin+Math.min(t,1)*(g.fMax-g.fMin));}document.getElementById('simSlider').value=Math.min(t*100,100);document.getElementById('simPct').textContent=Math.round(Math.min(t,1)*100)+'%';},30);}
  if(mode==='trip'){var ph=0,tt=0;simTimer=setInterval(function(){tt++;for(var i=0;i<8;i++){if(!gaugePVs[i]||!page.gauges[i])continue;var g=page.gauges[i];var mid=(g.la+g.ha)/2||((g.fMin+g.fMax)/2),rng=g.fMax-g.fMin,v;if(ph===0){v=mid+rng*.08*Math.sin(tt*.03+i*.3)+(Math.random()-.5)*rng*.01;if(tt>150){ph=1;tt=0;}}else if(ph===1){v=mid+rng*(tt/120)*.55;if(tt>120){ph=2;tt=0;}}else{v=g.fMax*.95;if(tt>60){ph=0;tt=0;}}gaugePVs[i]('_pn_value',v);}},30);}
  if(mode==='normal'){simTimer=setInterval(function(){for(var i=0;i<8;i++){if(!gaugePVs[i]||!page.gauges[i])continue;var g=page.gauges[i];var mid=(g.la+g.ha)/2||g.val,rng=(g.ha-g.la)||((g.fMax-g.fMin)*.3);gaugePVs[i]('_pn_value',mid+rng*.25*Math.sin(Date.now()*.0005+i*1.2)+(Math.random()-.5)*rng*.05);}},50);}
}

// ============================================================
//  Editor / Export
// ============================================================
function openEditor(){document.getElementById('codeEditor').value=svgSource;document.getElementById('editorOverlay').classList.add('show');}
function closeEditor(){document.getElementById('editorOverlay').classList.remove('show');}
function applyCode(){
  var src=document.getElementById('codeEditor').value;
  var blob=new Blob([src],{type:'image/svg+xml'}),url=URL.createObjectURL(blob);
  loadedCount=0;gaugePVs=[];
  for(var i=0;i<8;i++){(function(idx){var obj=document.getElementById('g'+idx);obj.data=url;obj.addEventListener('load',function handler(){obj.removeEventListener('load',handler);gaugePVs[idx]=obj.contentDocument.defaultView.putValue;loadedCount++;if(loadedCount===8){svgSource=src;showPage(currentPage);toast('Applied to all gauges');}});})(i);}
}
function exportFromEditor(){downloadSVG(document.getElementById('codeEditor').value);}
function exportSVG(){downloadSVG(svgSource);}
function downloadSVG(src){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([src],{type:'image/svg+xml'}));a.download='murphy-gauge.svg';document.body.appendChild(a);a.click();document.body.removeChild(a);toast('SVG exported');}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show';setTimeout(function(){t.className='toast';},2500);}
</script>
