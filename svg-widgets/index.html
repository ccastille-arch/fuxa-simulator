<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUXA Gauge Simulator — Compressor Package</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d1a;
    color: #c0c0c0;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    font-size: 13px;
    min-height: 100vh;
  }
  .header {
    background: #141428;
    border-bottom: 1px solid #2a2a40;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #e0e0e0;
  }
  .header .tag {
    background: #2ecc71;
    color: #000;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .main {
    display: flex;
    gap: 0;
    height: calc(100vh - 42px);
  }

  /* ---- Gauge display area ---- */
  .gauge-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-width: 380px;
    background: #0f0f1e;
  }
  .gauge-wrap {
    width: 100%;
    max-width: 520px;
  }
  .gauge-wrap object {
    width: 100%;
    height: auto;
  }
  .sim-bar {
    width: 100%;
    max-width: 520px;
    margin-top: 16px;
    background: #141428;
    border: 1px solid #2a2a40;
    border-radius: 8px;
    padding: 14px 18px;
  }
  .sim-bar label {
    display: block;
    font-size: 11px;
    color: #808090;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sim-bar .sim-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sim-bar input[type=range] {
    flex: 1;
    accent-color: #2ecc71;
    height: 6px;
  }
  .sim-bar .sim-val {
    font-size: 22px;
    font-weight: 700;
    color: #e0e0e0;
    min-width: 90px;
    text-align: right;
    font-family: 'Consolas', 'Courier New', monospace;
  }
  .sim-bar .sim-btns {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .sim-bar button {
    background: #1e1e35;
    border: 1px solid #3a3a50;
    color: #c0c0c0;
    padding: 5px 12px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
  }
  .sim-bar button:hover { background: #2a2a45; }
  .sim-bar button.active { border-color: #2ecc71; color: #2ecc71; }

  /* ---- Control panel ---- */
  .panel {
    width: 340px;
    background: #111122;
    border-left: 1px solid #2a2a40;
    overflow-y: auto;
    padding: 0;
    flex-shrink: 0;
  }
  .panel-section {
    border-bottom: 1px solid #1e1e30;
    padding: 14px 16px;
  }
  .panel-section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #606080;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .field {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }
  .field label {
    flex: 0 0 130px;
    font-size: 12px;
    color: #909090;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .field input[type=text],
  .field input[type=number] {
    flex: 1;
    background: #1a1a2e;
    border: 1px solid #3a3a50;
    color: #e0e0e0;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-family: 'Consolas', monospace;
    min-width: 0;
  }
  .field input:focus {
    outline: none;
    border-color: #2ecc71;
  }
  .field input[type=color] {
    width: 32px;
    height: 26px;
    border: 1px solid #3a3a50;
    border-radius: 4px;
    background: none;
    padding: 0;
    cursor: pointer;
  }
  .field .color-hex {
    flex: 1;
    background: #1a1a2e;
    border: 1px solid #3a3a50;
    color: #808080;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-family: 'Consolas', monospace;
  }
  .field select {
    flex: 1;
    background: #1a1a2e;
    border: 1px solid #3a3a50;
    color: #e0e0e0;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 12px;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }
  .toggle-row label { flex: 1; font-size: 12px; color: #909090; }
  .toggle {
    position: relative;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .slider {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #2a2a3a;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle .slider::before {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    left: 2px; bottom: 2px;
    background: #808080;
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle input:checked + .slider { background: #1a5e3a; }
  .toggle input:checked + .slider::before { transform: translateX(16px); background: #2ecc71; }

  /* Presets bar */
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 16px;
    border-bottom: 1px solid #1e1e30;
  }
  .presets button {
    background: #1a1a2e;
    border: 1px solid #3a3a50;
    color: #a0a0a0;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .presets button:hover { border-color: #2ecc71; color: #2ecc71; }

  .state-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-left: 8px;
  }

  @media (max-width: 800px) {
    .main { flex-direction: column; }
    .panel { width: 100%; border-left: none; border-top: 1px solid #2a2a40; max-height: 50vh; }
    .gauge-area { min-height: 280px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>FUXA Gauge Simulator</h1>
  <span class="tag">Compressor Package</span>
  <span id="stateBadge" class="state-badge" style="background:#e74c3c;color:#fff;">SHUTDOWN</span>
</div>

<div class="main">
  <!-- Gauge display -->
  <div class="gauge-area">
    <div class="gauge-wrap">
      <object id="gaugeObj" data="analog-gauge.svg" type="image/svg+xml" width="100%"></object>
    </div>
    <div class="sim-bar">
      <label>Process Value Simulator</label>
      <div class="sim-row">
        <input type="range" id="simSlider" min="0" max="1000" step="0.1" value="0">
        <span class="sim-val" id="simDisplay">0.0</span>
      </div>
      <div class="sim-btns">
        <button onclick="simRamp('up')">Ramp Up</button>
        <button onclick="simRamp('down')">Ramp Down</button>
        <button onclick="simRamp('sine')">Sine Wave</button>
        <button onclick="simRamp('trip')">Trip Scenario</button>
        <button id="simStopBtn" onclick="simRamp('stop')" style="display:none;">Stop</button>
      </div>
    </div>
  </div>

  <!-- Parameter panel -->
  <div class="panel">

    <div class="presets">
      <button onclick="loadPreset('suction')">Suction Press</button>
      <button onclick="loadPreset('discharge')">Discharge Press</button>
      <button onclick="loadPreset('jwTemp')">JW Temp</button>
      <button onclick="loadPreset('oilPress')">Oil Pressure</button>
      <button onclick="loadPreset('manifold')">Manifold Temp</button>
      <button onclick="loadPreset('fuelGas')">Fuel Gas Press</button>
    </div>

    <!-- Identity -->
    <div class="panel-section">
      <h3>Identity / Display</h3>
      <div class="field">
        <label>Label</label>
        <input type="text" id="f_ps_label" value="Process Value" onchange="sendField(this)">
      </div>
      <div class="field">
        <label>Unit</label>
        <input type="text" id="f_ps_unit" value="psi" onchange="sendField(this)">
      </div>
      <div class="field">
        <label>Precision</label>
        <input type="number" id="f_pn_precision" value="1" min="0" max="4" onchange="sendField(this)">
      </div>
      <div class="toggle-row">
        <label>Show Value</label>
        <div class="toggle"><input type="checkbox" id="f_pb_showValue" checked onchange="sendField(this)"><span class="slider"></span></div>
      </div>
      <div class="toggle-row">
        <label>Show Label</label>
        <div class="toggle"><input type="checkbox" id="f_pb_showLabel" checked onchange="sendField(this)"><span class="slider"></span></div>
      </div>
      <div class="toggle-row">
        <label>Show Unit</label>
        <div class="toggle"><input type="checkbox" id="f_pb_showUnit" checked onchange="sendField(this)"><span class="slider"></span></div>
      </div>
      <div class="toggle-row">
        <label>Show Min/Max</label>
        <div class="toggle"><input type="checkbox" id="f_pb_showMinMaxText" checked onchange="sendField(this)"><span class="slider"></span></div>
      </div>
    </div>

    <!-- Instrument Range -->
    <div class="panel-section">
      <h3>Instrument Range</h3>
      <div class="field">
        <label>Full Min</label>
        <input type="number" id="f_pn_fullMin" value="0" onchange="sendField(this)">
      </div>
      <div class="field">
        <label>Full Max</label>
        <input type="number" id="f_pn_fullMax" value="1000" onchange="sendField(this)">
      </div>
    </div>

    <!-- Alarm / Shutdown -->
    <div class="panel-section">
      <h3>Alarm / Shutdown Thresholds</h3>
      <div class="field">
        <label style="color:#e74c3c">Low Shutdown</label>
        <input type="number" id="f_pn_lowShutdown" value="50" onchange="sendField(this)">
      </div>
      <div class="field">
        <label style="color:#f39c12">Low Alarm</label>
        <input type="number" id="f_pn_lowAlarm" value="100" onchange="sendField(this)">
      </div>
      <div class="field">
        <label style="color:#f39c12">High Alarm</label>
        <input type="number" id="f_pn_highAlarm" value="400" onchange="sendField(this)">
      </div>
      <div class="field">
        <label style="color:#e74c3c">High Shutdown</label>
        <input type="number" id="f_pn_highShutdown" value="500" onchange="sendField(this)">
      </div>
    </div>

    <!-- Scaling -->
    <div class="panel-section">
      <h3>Scaling</h3>
      <div class="toggle-row">
        <label>Auto Scale</label>
        <div class="toggle"><input type="checkbox" id="f_pb_autoScale" checked onchange="sendField(this)"><span class="slider"></span></div>
      </div>
      <div class="field">
        <label>Manual Display Min</label>
        <input type="number" id="f_pn_manualDisplayMin" value="0" onchange="sendField(this)">
      </div>
      <div class="field">
        <label>Manual Display Max</label>
        <input type="number" id="f_pn_manualDisplayMax" value="500" onchange="sendField(this)">
      </div>
      <div class="field">
        <label>Scale Padding %</label>
        <input type="number" id="f_pn_scalePaddingPercent" value="10" min="0" max="50" onchange="sendField(this)">
      </div>
    </div>

    <!-- Colors -->
    <div class="panel-section">
      <h3>Colors</h3>
      <div class="field">
        <label>Normal</label>
        <input type="color" id="f_pc_normalColor" value="#2ecc71" onchange="sendField(this)">
        <input type="text" class="color-hex" id="f_pc_normalColor_hex" value="#2ecc71" readonly>
      </div>
      <div class="field">
        <label>Alarm</label>
        <input type="color" id="f_pc_alarmColor" value="#f39c12" onchange="sendField(this)">
        <input type="text" class="color-hex" id="f_pc_alarmColor_hex" value="#f39c12" readonly>
      </div>
      <div class="field">
        <label>Shutdown</label>
        <input type="color" id="f_pc_shutdownColor" value="#e74c3c" onchange="sendField(this)">
        <input type="text" class="color-hex" id="f_pc_shutdownColor_hex" value="#e74c3c" readonly>
      </div>
      <div class="field">
        <label>Background Arc</label>
        <input type="color" id="f_pc_bgArcColor" value="#3a3a4a" onchange="sendField(this)">
        <input type="text" class="color-hex" id="f_pc_bgArcColor_hex" value="#3a3a4a" readonly>
      </div>
      <div class="field">
        <label>Pointer</label>
        <input type="color" id="f_pc_pointerColor" value="#ffffff" onchange="sendField(this)">
        <input type="text" class="color-hex" id="f_pc_pointerColor_hex" value="#ffffff" readonly>
      </div>
      <div class="field">
        <label>Label</label>
        <input type="color" id="f_pc_labelColor" value="#a0a0a0" onchange="sendField(this)">
        <input type="text" class="color-hex" id="f_pc_labelColor_hex" value="#a0a0a0" readonly>
      </div>
      <div class="field">
        <label>Ticks</label>
        <input type="color" id="f_pc_tickColor" value="#707070" onchange="sendField(this)">
        <input type="text" class="color-hex" id="f_pc_tickColor_hex" value="#707070" readonly>
      </div>
      <div class="field">
        <label>Face</label>
        <input type="color" id="f_pc_faceColor" value="#1a1a2e" onchange="sendField(this)">
        <input type="text" class="color-hex" id="f_pc_faceColor_hex" value="#1a1a2e" readonly>
      </div>
      <div class="field">
        <label>Border</label>
        <input type="color" id="f_pc_borderColor" value="#3a3a50" onchange="sendField(this)">
        <input type="text" class="color-hex" id="f_pc_borderColor_hex" value="#3a3a50" readonly>
      </div>
    </div>

    <!-- Writeback -->
    <div class="panel-section">
      <h3>Writeback</h3>
      <div class="toggle-row">
        <label>Enable Writeback</label>
        <div class="toggle"><input type="checkbox" id="f_pb_enableWriteback" onchange="sendField(this)"><span class="slider"></span></div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  Gauge communication
// ============================================================

var gaugeDoc = null;
var gaugePutValue = null;

document.getElementById('gaugeObj').addEventListener('load', function() {
  gaugeDoc = this.contentDocument;
  gaugePutValue = gaugeDoc.defaultView.putValue;
  // Push all current panel values into the gauge
  syncAllFields();
});

function pv(id, val) {
  if (gaugePutValue) gaugePutValue(id, val);
}

// ============================================================
//  Field → gauge mapping
// ============================================================

// Map field element id → exported variable name
function fieldToVar(fieldId) {
  return '_' + fieldId.substring(2); // f_ps_label → _ps_label
}

function sendField(el) {
  var varName = fieldToVar(el.id);
  var val;
  if (el.type === 'checkbox') {
    val = el.checked;
  } else if (el.type === 'color') {
    val = el.value;
    // Update hex display
    var hexEl = document.getElementById(el.id + '_hex');
    if (hexEl) hexEl.value = el.value;
  } else if (el.type === 'number') {
    val = parseFloat(el.value);
  } else {
    val = el.value;
  }
  pv(varName, val);
  updateSimSliderRange();
  updateStateBadge();
}

function syncAllFields() {
  var fields = document.querySelectorAll('.panel input, .panel select');
  for (var i = 0; i < fields.length; i++) {
    var el = fields[i];
    if (el.id && el.id.startsWith('f_') && !el.id.endsWith('_hex')) {
      sendField(el);
    }
  }
  // Also push current slider value
  sendSliderValue();
}

// ============================================================
//  Simulator slider
// ============================================================

var simSlider = document.getElementById('simSlider');
var simDisplay = document.getElementById('simDisplay');

function sendSliderValue() {
  var val = parseFloat(simSlider.value);
  var prec = parseInt(document.getElementById('f_pn_precision').value) || 1;
  simDisplay.textContent = val.toFixed(prec);
  pv('_pn_value', val);
  updateStateBadge();
  updateSimDisplayColor(val);
}

simSlider.addEventListener('input', sendSliderValue);

function updateSimSliderRange() {
  var fMin = parseFloat(document.getElementById('f_pn_fullMin').value) || 0;
  var fMax = parseFloat(document.getElementById('f_pn_fullMax').value) || 1000;
  // Allow slider to go slightly beyond instrument range to test clamping
  simSlider.min = fMin - (fMax - fMin) * 0.05;
  simSlider.max = fMax + (fMax - fMin) * 0.05;
  simSlider.step = (fMax - fMin) / 2000;
}

function updateSimDisplayColor(val) {
  var ls = parseFloat(document.getElementById('f_pn_lowShutdown').value);
  var la = parseFloat(document.getElementById('f_pn_lowAlarm').value);
  var ha = parseFloat(document.getElementById('f_pn_highAlarm').value);
  var hs = parseFloat(document.getElementById('f_pn_highShutdown').value);
  var sdCol = document.getElementById('f_pc_shutdownColor').value;
  var alCol = document.getElementById('f_pc_alarmColor').value;
  var nmCol = document.getElementById('f_pc_normalColor').value;
  if (val <= ls || val >= hs) simDisplay.style.color = sdCol;
  else if (val <= la || val >= ha) simDisplay.style.color = alCol;
  else simDisplay.style.color = nmCol;
}

// ============================================================
//  State badge
// ============================================================

function updateStateBadge() {
  var val = parseFloat(simSlider.value);
  var ls = parseFloat(document.getElementById('f_pn_lowShutdown').value);
  var la = parseFloat(document.getElementById('f_pn_lowAlarm').value);
  var ha = parseFloat(document.getElementById('f_pn_highAlarm').value);
  var hs = parseFloat(document.getElementById('f_pn_highShutdown').value);
  var badge = document.getElementById('stateBadge');

  if (val <= ls || val >= hs) {
    badge.textContent = 'SHUTDOWN';
    badge.style.background = document.getElementById('f_pc_shutdownColor').value;
    badge.style.color = '#fff';
  } else if (val <= la || val >= ha) {
    badge.textContent = 'ALARM';
    badge.style.background = document.getElementById('f_pc_alarmColor').value;
    badge.style.color = '#000';
  } else {
    badge.textContent = 'NORMAL';
    badge.style.background = document.getElementById('f_pc_normalColor').value;
    badge.style.color = '#000';
  }
}

// ============================================================
//  Simulation modes
// ============================================================

var simTimer = null;

function simRamp(mode) {
  if (simTimer) { clearInterval(simTimer); simTimer = null; }
  document.getElementById('simStopBtn').style.display = (mode === 'stop') ? 'none' : 'inline-block';

  if (mode === 'stop') return;

  var fMin = parseFloat(document.getElementById('f_pn_fullMin').value) || 0;
  var fMax = parseFloat(document.getElementById('f_pn_fullMax').value) || 1000;
  var ls = parseFloat(document.getElementById('f_pn_lowShutdown').value) || fMin;
  var hs = parseFloat(document.getElementById('f_pn_highShutdown').value) || fMax;
  var range = hs - ls;
  var mid = (ls + hs) / 2;

  if (mode === 'up') {
    simSlider.value = ls - range * 0.1;
    simTimer = setInterval(function() {
      var v = parseFloat(simSlider.value) + range * 0.003;
      if (v > hs + range * 0.15) v = ls - range * 0.1;
      simSlider.value = v;
      sendSliderValue();
    }, 30);
  }

  if (mode === 'down') {
    simSlider.value = hs + range * 0.1;
    simTimer = setInterval(function() {
      var v = parseFloat(simSlider.value) - range * 0.003;
      if (v < ls - range * 0.15) v = hs + range * 0.1;
      simSlider.value = v;
      sendSliderValue();
    }, 30);
  }

  if (mode === 'sine') {
    var t = 0;
    simTimer = setInterval(function() {
      t += 0.015;
      var v = mid + (range * 0.65) * Math.sin(t);
      simSlider.value = v;
      sendSliderValue();
    }, 30);
  }

  if (mode === 'trip') {
    // Simulate a normal-running value that suddenly spikes into shutdown
    var phase = 0; // 0=normal, 1=spike, 2=trip
    var tt = 0;
    simSlider.value = mid;
    simTimer = setInterval(function() {
      tt++;
      if (phase === 0) {
        // Normal oscillation around midpoint
        var v = mid + range * 0.15 * Math.sin(tt * 0.04) + (Math.random() - 0.5) * range * 0.02;
        simSlider.value = v;
        if (tt > 120) { phase = 1; tt = 0; }
      } else if (phase === 1) {
        // Rapid rise toward high shutdown
        var v = parseFloat(simSlider.value) + range * 0.012;
        simSlider.value = v;
        if (v >= hs + range * 0.05) { phase = 2; tt = 0; }
      } else {
        // Hold at shutdown for a bit, then restart
        if (tt > 80) { phase = 0; tt = 0; simSlider.value = mid; }
      }
      sendSliderValue();
    }, 30);
  }
}

// ============================================================
//  Presets — Cat 3516 compressor package typical values
// ============================================================

var PRESETS = {
  suction: {
    _ps_label: 'Suction Pressure', _ps_unit: 'psig', _pn_precision: 1,
    _pn_fullMin: 0, _pn_fullMax: 500,
    _pn_lowShutdown: 15, _pn_lowAlarm: 25, _pn_highAlarm: 90, _pn_highShutdown: 100,
    _pb_autoScale: true, _pn_scalePaddingPercent: 15,
    _pn_manualDisplayMin: 0, _pn_manualDisplayMax: 150,
    startVal: 55
  },
  discharge: {
    _ps_label: 'Discharge Pressure', _ps_unit: 'psig', _pn_precision: 0,
    _pn_fullMin: 0, _pn_fullMax: 1500,
    _pn_lowShutdown: 400, _pn_lowAlarm: 500, _pn_highAlarm: 900, _pn_highShutdown: 1000,
    _pb_autoScale: true, _pn_scalePaddingPercent: 10,
    _pn_manualDisplayMin: 0, _pn_manualDisplayMax: 1200,
    startVal: 720
  },
  jwTemp: {
    _ps_label: 'JW Temperature', _ps_unit: '\u00B0F', _pn_precision: 1,
    _pn_fullMin: 0, _pn_fullMax: 300,
    _pn_lowShutdown: 100, _pn_lowAlarm: 120, _pn_highAlarm: 200, _pn_highShutdown: 220,
    _pb_autoScale: true, _pn_scalePaddingPercent: 12,
    _pn_manualDisplayMin: 50, _pn_manualDisplayMax: 250,
    startVal: 175
  },
  oilPress: {
    _ps_label: 'Lube Oil Pressure', _ps_unit: 'psig', _pn_precision: 1,

function loadPreset(name) {
  if (simTimer) simRamp('stop');
  var p = PRESETS[name];
  if (!p) return;

  // Map preset keys to form fields
  var fieldMap = {
    '_ps_label': 'f_ps_label', '_ps_unit': 'f_ps_unit', '_pn_precision': 'f_pn_precision',
    '_pn_fullMin': 'f_pn_fullMin', '_pn_fullMax': 'f_pn_fullMax',
    '_pn_lowShutdown': 'f_pn_lowShutdown', '_pn_lowAlarm': 'f_pn_lowAlarm',
    '_pn_highAlarm': 'f_pn_highAlarm', '_pn_highShutdown': 'f_pn_highShutdown',
    '_pb_autoScale': 'f_pb_autoScale', '_pn_scalePaddingPercent': 'f_pn_scalePaddingPercent',
    '_pn_manualDisplayMin': 'f_pn_manualDisplayMin', '_pn_manualDisplayMax': 'f_pn_manualDisplayMax'
  };

  for (var key in fieldMap) {
    if (p[key] === undefined) continue;
    var el = document.getElementById(fieldMap[key]);
    if (!el) continue;
    if (el.type === 'checkbox') el.checked = !!p[key];
    else el.value = p[key];
  }

  // Update slider range then set start value
  updateSimSliderRange();
  simSlider.value = p.startVal !== undefined ? p.startVal : 0;

  // Push everything to gauge
  syncAllFields();
}

// Init slider range on load
updateSimSliderRange();
